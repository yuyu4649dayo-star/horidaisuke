<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ナイター・スラッガー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --page-bg:#E4E9F0; --page-fg:#0E1A33; --muted:#53617F;
  --night:#0E1A33; --night-2:#18284D; --night-3:#223562; --chalk:#F1F4EC; --lamp:#FFC83D;
  --b:#52D08C; --s:#FFC83D; --o:#F2594B; --lamp-off:#2B3B63; --line:rgba(241,244,236,.22);
  --f-disp:"Dela Gothic One","Hiragino Sans","Yu Gothic",sans-serif;
  --f-dot:"DotGothic16","Hiragino Sans","Yu Gothic",monospace;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --page-bg:#070D1F; --page-fg:#E8EDF5; --muted:#8C9AB8; }
}
:root[data-theme="dark"]{ --page-bg:#070D1F; --page-fg:#E8EDF5; --muted:#8C9AB8; }
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100%;background:var(--page-bg);color:var(--page-fg);font-family:var(--f-body);-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button{font-family:inherit;touch-action:manipulation;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #7CB4FF;outline-offset:2px}
.hidden{display:none !important}

/* ---- ゲーム画面 ---- */
.game{width:100%;max-width:1180px;margin:0 auto;padding:8px 10px 12px;display:grid;gap:8px;justify-items:center;
  grid-template-columns:minmax(0,1fr);grid-template-areas:"board" "cards" "stage" "ctrl"}
.g-board{grid-area:board;width:100%;max-width:520px}
.g-cards{grid-area:cards;width:100%;max-width:520px;display:grid;grid-template-columns:1fr 1fr;gap:6px}
.g-stage{grid-area:stage;width:100%;display:flex;justify-content:center}
.g-ctrl{grid-area:ctrl;width:100%;max-width:520px;display:flex;flex-direction:column;gap:8px}
@media (min-width:860px) and (min-aspect-ratio:1/1){
  .game{grid-template-columns:minmax(260px,1fr) auto minmax(260px,1fr);grid-template-areas:"board stage ctrl" "cards stage ctrl";grid-template-rows:auto 1fr;align-items:start;gap:12px}
  .g-board,.g-cards,.g-ctrl{max-width:none}
  .g-cards{grid-template-columns:1fr;align-content:start}
}
.board{background:var(--night);border-radius:12px;padding:8px 12px;color:var(--lamp);font-family:var(--f-dot);box-shadow:inset 0 0 0 1px rgba(255,200,61,.18);display:grid;gap:6px}
.b-top{display:flex;align-items:center;gap:10px}
.tm{display:flex;align-items:center;gap:6px;flex:1;min-width:0}
.tm .chip{width:10px;height:26px;border-radius:3px;flex:none}
.tm b{font-weight:400;font-size:13px;color:#C9D5F0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tm span{font-size:28px;line-height:1;margin-left:auto}
.tm.bat b{color:var(--lamp)}
.inn{font-size:15px;color:#fff;background:var(--night-3);border-radius:8px;padding:5px 9px;white-space:nowrap}
.b-bot{display:flex;align-items:center;gap:12px}
.counts{display:flex;gap:10px;align-items:center}
.counts .row{display:flex;align-items:center;gap:4px}
.counts b{font-weight:400;width:10px;font-size:12px;color:#9FB0D6}
.lamps{display:flex;gap:3px}
.lamp{display:block;width:10px;height:10px;border-radius:50%;background:var(--lamp-off)}
#lb .lamp.on{background:var(--b);box-shadow:0 0 6px var(--b)}
#ls .lamp.on{background:var(--s);box-shadow:0 0 6px var(--s)}
#lo .lamp.on{background:var(--o);box-shadow:0 0 6px var(--o)}
.dia{width:40px;height:40px}
.dia rect{fill:var(--lamp-off)}
.dia rect.on{fill:var(--lamp);filter:drop-shadow(0 0 3px var(--lamp))}
.dia .home{fill:#9FB0D6}
.sp{flex:1}
.ibtn{background:none;border:1.5px solid rgba(159,176,214,.5);color:#C9D5F0;border-radius:9px;min-width:40px;height:40px;font:700 13px var(--f-body);padding:0 8px}
.ibtn[aria-pressed="true"]{text-decoration:line-through;color:#6D7DA3}
.pcard{display:flex;gap:8px;align-items:center;background:var(--night);border-radius:12px;padding:6px 8px;color:#E8EDF5;min-width:0}
.pcard canvas{width:46px;height:46px;border-radius:8px;background:var(--night-3);flex:none}
.pcard .tx{min-width:0;display:flex;flex-direction:column;gap:2px;font-size:12px;line-height:1.25}
.pcard .nm{font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pcard .sub{color:#9FB0D6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pcard .fm{font-weight:700}
.pcard .bar{height:5px;border-radius:3px;background:var(--lamp-off);overflow:hidden}
.pcard .bar i{display:block;height:100%;background:var(--b)}
.pcard .tag{font-size:10px;color:var(--lamp)}

.stage{position:relative;width:min(100%,calc((100dvh - 270px)*.625));min-width:280px;border-radius:14px;overflow:hidden;background:#08112B;box-shadow:0 10px 30px rgba(0,0,0,.35)}
@media (min-width:860px) and (min-aspect-ratio:1/1){ .stage{width:calc((100dvh - 28px)*.625)} }
canvas#c{display:block;width:100%;height:auto;aspect-ratio:400/640;touch-action:none;user-select:none;-webkit-user-select:none;cursor:crosshair}
#toast{position:absolute;left:10px;right:10px;bottom:12px;background:rgba(8,15,32,.9);color:var(--chalk);border-radius:10px;padding:10px 12px;font-size:14px;line-height:1.5;border-left:4px solid var(--lamp);pointer-events:none;opacity:0;transform:translateY(6px);transition:opacity .2s,transform .2s}
#toast.on{opacity:1;transform:none}
#toast b{color:var(--lamp)}
.pbar{display:flex;flex-wrap:wrap;gap:6px}
.pt{flex:1 1 30%;min-width:96px;min-height:46px;border-radius:10px;border:1.5px solid var(--line);background:var(--night);color:#E8EDF5;font:700 13px var(--f-body);padding:6px 8px;display:flex;flex-direction:column;align-items:center;gap:1px}
.pt small{font:400 11px var(--f-dot);color:#9FB0D6}
.pt[aria-pressed="true"]{background:var(--lamp);border-color:var(--lamp);color:#0E1A33}
.pt[aria-pressed="true"] small{color:#3B3513}
.hintbox{margin:0;font-size:12.5px;line-height:1.65;color:var(--muted)}
.synbox{display:flex;flex-wrap:wrap;gap:5px}
.badge{font-size:11px;background:var(--night-2);color:var(--lamp);border-radius:999px;padding:3px 9px}

/* ---- 画面（メニュー・エディタ） ---- */
.screen{position:fixed;inset:0;z-index:50;overflow:auto;-webkit-overflow-scrolling:touch;color:var(--chalk);
  background:radial-gradient(120% 80% at 50% 0%,#1E3366 0%,#0B1534 55%,#070D22 100%);
  padding:calc(env(safe-area-inset-top,0px) + 16px) 16px calc(env(safe-area-inset-bottom,0px) + 28px)}
.sheet{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.sheet h1{font-family:var(--f-disp);font-weight:400;font-size:clamp(34px,9vw,58px);line-height:1.08;margin:8px 0 0}
.sheet h2{font-family:var(--f-disp);font-weight:400;font-size:24px;margin:0}
.sheet h3{font-size:15px;margin:6px 0 0;color:var(--lamp)}
.sheet p{margin:0;line-height:1.7;color:#D6DEEE;font-size:14.5px}
.btn{min-height:50px;padding:12px 18px;border:0;border-radius:11px;background:var(--lamp);color:#0E1A33;font:400 19px var(--f-disp)}
.btn.sec{background:transparent;color:var(--chalk);border:1.5px solid rgba(241,244,236,.4);font:700 15px var(--f-body)}
.btn.sm{min-height:40px;padding:8px 14px;font:700 14px var(--f-body)}
.btn.warn{background:#B8362D;color:#fff;font:700 14px var(--f-body)}
.btn:active{transform:translateY(1px)}
.menu{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.bar-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:1fr;gap:10px}
@media (min-width:640px){.grid2{grid-template-columns:1fr 1fr}}
.panel{background:rgba(24,40,77,.75);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.field{display:flex;flex-direction:column;gap:5px;font-size:13px;color:#B9C6E2}
.field input[type=text],.field input[type=number],.field select{min-height:44px;border-radius:9px;border:1.5px solid var(--line);background:#0B1534;color:var(--chalk);font:500 16px var(--f-body);padding:0 12px;width:100%}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1;min-height:44px;padding:8px 10px;border-radius:9px;border:1.5px solid rgba(241,244,236,.35);background:transparent;color:var(--chalk);font:700 14px var(--f-body)}
.seg button[aria-checked="true"],.seg button[aria-pressed="true"]{background:var(--lamp);border-color:var(--lamp);color:#0E1A33}
.tcard{display:flex;align-items:center;gap:12px;background:rgba(24,40,77,.75);border:1.5px solid var(--line);border-radius:14px;padding:10px 12px;color:inherit;text-align:left;width:100%}
.tcard[aria-pressed="true"]{border-color:var(--lamp);box-shadow:0 0 0 2px rgba(255,200,61,.35)}
.tcard canvas{width:48px;height:48px;flex:none}
.tcard .t1{font-weight:700;font-size:15px}
.tcard .t2{font-size:12px;color:#9FB0D6}
.slots{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media (min-width:600px){.slots{grid-template-columns:repeat(3,1fr)}}
.slot{display:flex;gap:8px;align-items:center;background:rgba(24,40,77,.8);border:1.5px solid var(--line);border-radius:12px;padding:8px;color:inherit;text-align:left;min-height:62px}
.slot canvas{width:46px;height:46px;border-radius:8px;background:var(--night-3);flex:none}
.slot .s1{font-size:11px;color:var(--lamp)}
.slot .s2{font-size:13px;font-weight:700;line-height:1.25}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chipb{border:1.5px solid var(--line);background:transparent;color:var(--chalk);border-radius:999px;padding:8px 13px;font:700 13px var(--f-body);min-height:40px}
.chipb[aria-pressed="true"]{background:var(--lamp);color:#0E1A33;border-color:var(--lamp)}
.swatch{width:36px;height:36px;border-radius:50%;border:2.5px solid transparent;padding:0}
.swatch[aria-pressed="true"]{border-color:#fff;box-shadow:0 0 0 2px #0B1534 inset}
.prow{display:flex;align-items:center;gap:8px;font-size:14px}
.prow .l{width:84px;color:#B9C6E2}
.prow .v{flex:1;text-align:center;font-weight:700}
.prow button{width:44px;height:44px;border-radius:9px;border:1.5px solid var(--line);background:transparent;color:var(--chalk);font-size:16px}
.srow{display:grid;grid-template-columns:76px 1fr 34px;align-items:center;gap:8px;font-size:14px}
.srow input[type=range]{width:100%;height:36px;accent-color:#FFC83D}
.srow .n{font-family:var(--f-dot);font-size:18px;color:var(--lamp);text-align:right}
.pool{font-family:var(--f-dot);font-size:17px;color:var(--lamp)}
.preview{display:flex;gap:14px;align-items:center}
.preview canvas{width:132px;height:132px;border-radius:14px;background:var(--night-3);flex:none}
.tut{display:flex;flex-direction:column;gap:10px}
.dots{display:flex;gap:6px;justify-content:center}
.dots i{width:9px;height:9px;border-radius:50%;background:#33466F}
.dots i.on{background:var(--lamp)}
table.ls{border-collapse:collapse;width:100%;font-family:var(--f-dot);font-size:14px}
table.ls th,table.ls td{padding:6px 4px;text-align:center;border-bottom:1px solid var(--line)}
table.ls td:first-child,table.ls th:first-child{text-align:left}
.big{font-family:var(--f-dot);font-size:64px;line-height:1;color:var(--lamp)}
.note{font-size:12px;color:#9FB0D6}
</style>
</head>
<body>
<div class="game hidden" id="game">
  <div class="g-board">
    <div class="board" aria-label="スコアボード">
      <div class="b-top">
        <div class="tm" id="tmA"><i class="chip"></i><b id="nmA">-</b><span id="scA">0</span></div>
        <div class="tm" id="tmH"><i class="chip"></i><b id="nmH">-</b><span id="scH">0</span></div>
        <div class="inn" id="inn">1回表</div>
      </div>
      <div class="b-bot">
        <div class="counts">
          <div class="row"><b>B</b><span class="lamps" id="lb"></span></div>
          <div class="row"><b>S</b><span class="lamps" id="ls"></span></div>
          <div class="row"><b>O</b><span class="lamps" id="lo"></span></div>
        </div>
        <svg class="dia" viewBox="0 0 44 44" aria-label="走者">
          <rect id="b2" x="-5" y="-5" width="10" height="10" transform="translate(22 9) rotate(45)"/>
          <rect id="b3" x="-5" y="-5" width="10" height="10" transform="translate(9 22) rotate(45)"/>
          <rect id="b1" x="-5" y="-5" width="10" height="10" transform="translate(35 22) rotate(45)"/>
          <rect class="home" x="-4" y="-4" width="8" height="8" transform="translate(22 35) rotate(45)"/>
        </svg>
        <span class="sp"></span>
        <button class="ibtn" id="mute" aria-label="効果音" aria-pressed="false">音</button>
        <button class="ibtn" id="menuBtn" aria-label="メニュー">メニュー</button>
      </div>
    </div>
  </div>
  <div class="g-cards"><div class="pcard" id="cardBat"></div><div class="pcard" id="cardPit"></div></div>
  <div class="g-stage"><div class="stage"><canvas id="c" aria-label="野球ゲーム画面"></canvas><div id="toast" role="status"></div></div></div>
  <div class="g-ctrl">
    <div class="pbar hidden" id="pbar"></div>
    <p class="hintbox" id="hint"></p>
    <div class="synbox" id="syn"></div>
  </div>
</div>
<div id="screens"></div>
<script>
'use strict';
/* ================= コア ================= */
const W=400,H=640;let SC=2;
const $=id=>document.getElementById(id);
const cv=$('c'),ctx=cv.getContext('2d');
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),lerp=(a,b,t)=>a+(b-a)*t;
const rnd=n=>Math.floor(Math.random()*n),rndf=(a,b)=>a+Math.random()*(b-a),pick=a=>a[rnd(a.length)];
const gauss=()=>{let u=0;while(!u)u=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(6.2831853*Math.random());};
const easeOut=t=>1-Math.pow(1-t,3),easeIO=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const sstep=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);};
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function h(tag,attrs,...kids){
  const e=document.createElement(tag);
  for(const k in (attrs||{})){const v=attrs[k];
    if(k==='class')e.className=v;else if(k==='on'){for(const ev in v)e.addEventListener(ev,v[ev]);}
    else if(k==='html')e.innerHTML=v;else if(v===true)e.setAttribute(k,'');else if(v!==false&&v!=null)e.setAttribute(k,v);}
  kids.flat(2).forEach(c=>{if(c==null||c===false)return;e.append(c.nodeType?c:document.createTextNode(c));});
  return e;
}
function shade(hex,amt){
  const n=parseInt(hex.slice(1,7),16);
  const r=clamp((n>>16)+amt,0,255),g=clamp(((n>>8)&255)+amt,0,255),b=clamp((n&255)+amt,0,255);
  return '#'+((1<<24)+(Math.round(r)<<16)+(Math.round(g)<<8)+Math.round(b)).toString(16).slice(1);
}
const F_D='"Dela Gothic One","Hiragino Sans","Yu Gothic",sans-serif';
const F_M='"DotGothic16","Hiragino Sans","Yu Gothic",monospace';

/* ================= データ ================= */
const MAX_KMH=170.6;
const SKIN=['#F6D5B8','#EBC09A','#D9A073','#B97B50','#8D5A3B','#5E3B26'];
const HAIRC=['#1B1B1F','#3B2A1F','#6B4A2B','#B8873A','#B7B7BF','#C0392B'];
const PARTS={shape:3,skin:6,hair:6,hairC:6,eyes:4,brows:3,mouth:4,acc:5};
const PART_LABEL={shape:'輪郭',skin:'肌の色',hair:'髪型',hairC:'髪の色',eyes:'目',brows:'眉',mouth:'口',acc:'アクセサリー'};
const PART_NAMES={
  shape:['丸顔','面長','角張り'],skin:['色白','明るめ','ふつう','小麦色','濃いめ','褐色'],
  hair:['スキンヘッド','坊主','七三','ツンツン','長髪','カーリー'],hairC:['黒','焦げ茶','茶','金髪','銀髪','赤'],
  eyes:['まる目','細め','大きな目','鋭い目'],brows:['細眉','太眉','きりっ眉'],mouth:['にっこり','への字','大笑い','にやり'],
  acc:['なし','メガネ','アイブラック','あごひげ','サングラス']
};
const BSTAT=[['contact','ミート'],['power','パワー'],['eye','選球眼'],['speed','走力'],['defense','守備']];
const PSTAT=[['velocity','球速'],['control','制球'],['move','変化'],['stamina','スタミナ']];
const BPOOL=270,PPOOL=230,SMIN=20,SMAX=99;
const PERS={
  fierce:{n:'強気',d:'長打力が上がる。選球眼は少し下がる',m:{power:5,eye:-4},vol:1},
  calm:{n:'冷静',d:'選球眼と制球が安定。不調になりにくい',m:{eye:5,control:4},vol:.5},
  diligent:{n:'努力家',d:'ミートとスタミナが上がる。調子が崩れにくい',m:{contact:4,stamina:5},vol:.7},
  genius:{n:'天才肌',d:'全能力が少し上がる。調子の波が大きい',m:{contact:3,power:3,eye:3,speed:3,defense:3,velocity:3,control:3,move:3},vol:1.6},
  clutch:{n:'勝負師',d:'チャンス・ピンチで強い。普段は少し控えめ',m:{},clutch:8,base:-2,vol:1},
  mood:{n:'ムードメーカー',d:'チーム全員の調子が戻りやすい',m:{speed:3},vol:1},
  careful:{n:'慎重',d:'制球が高い。球速は少し控えめ',m:{control:6,velocity:-3,eye:3},vol:.8},
  flashy:{n:'お調子者',d:'好調のとき大きく伸びる。不調のときは大きく落ちる',m:{},vol:1.3,formGain:1.6,formLoss:1.5}
};
const PKEYS=Object.keys(PERS);
const FORMS=[{n:'絶不調',c:'#F2594B',a:'▼▼'},{n:'不調',c:'#F29A4B',a:'▼'},{n:'普通',c:'#C9D5F0',a:'―'},{n:'好調',c:'#7FE0A8',a:'▲'},{n:'絶好調',c:'#FFC83D',a:'▲▲'}];
const formInfo=f=>FORMS[clamp(f,-2,2)+2];
const PT={
  straight:{n:'ストレート',d:0,ox:0,oy:0},shoot:{n:'シュート',d:3,ox:-22,oy:-6},slider:{n:'スライダー',d:12,ox:42,oy:-10},
  curve:{n:'カーブ',d:26,ox:48,oy:-52},fork:{n:'フォーク',d:10,ox:0,oy:-62},change:{n:'チェンジアップ',d:24,ox:8,oy:-14}
};
const PITCH_OPT=['shoot','slider','curve','fork','change'];
const SURN=['佐藤','鈴木','高橋','田中','伊藤','渡辺','山本','中村','小林','加藤','吉田','山田','松本','井上','木村','林','斎藤','清水','森','池田','橋本','阿部','石川','藤田','後藤','岡田','村上','近藤','坂本','三浦'];
const GIVEN=['大地','翔','蓮','颯太','拓海','悠斗','陽向','隼人','海斗','健太','優','誠','剛','勇気','直樹','大輔','翼','慎吾','航','龍','光','和也','純','岳','雄大'];

const shuffle=(rng,a)=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
function randFace(rng){const f={};for(const k in PARTS)f[k]=Math.floor(rng()*PARTS[k]);return f;}
function allocate(rng,keys,pool){
  const st={};let w=keys.map(()=>rng()+.25);const sw=w.reduce((a,b)=>a+b,0);const rem=pool-SMIN*keys.length;
  keys.forEach((k,i)=>{st[k]=clamp(Math.round(SMIN+rem*w[i]/sw),SMIN,SMAX);});
  let diff=pool-keys.reduce((a,k)=>a+st[k],0),g=400;
  while(diff!==0&&g--){const k=keys[Math.floor(rng()*keys.length)];if(diff>0&&st[k]<SMAX){st[k]++;diff--;}else if(diff<0&&st[k]>SMIN){st[k]--;diff++;}}
  return st;
}
function genPlayer(rng,role,lvl,num){
  const keys=(role==='B'?BSTAT:PSTAT).map(a=>a[0]);
  const stats=allocate(rng,keys,Math.round((role==='B'?BPOOL:PPOOL)*lvl));
  return {name:SURN[Math.floor(rng()*SURN.length)]+GIVEN[Math.floor(rng()*GIVEN.length)],num,role,
    bat:rng()<.25?'L':'R',thr:(role==='P'&&rng()<.25)?'L':'R',face:randFace(rng),stats,
    pers:PKEYS[Math.floor(rng()*PKEYS.length)],
    pitches:role==='P'?['straight',...shuffle(rng,PITCH_OPT).slice(0,2+Math.floor(rng()*2))]:null};
}
function genTeam(rng,meta,lvl){
  const nums=shuffle(rng,Array.from({length:60},(_,i)=>i+1));
  const players=[];
  for(let i=0;i<9;i++)players.push(genPlayer(rng,'B',lvl,nums[i]));
  players.push(genPlayer(rng,'P',lvl,18));

}

function synergies(t){
  const all=t.players.slice();if(t.manager)all.push(t.manager);
  const bats=t.players.filter(p=>p.role==='B'),pits=t.players.filter(p=>p.role==='P');
  const cnt=k=>all.filter(p=>p.pers===k).length;
  const avg=(a,k)=>a.reduce((s,p)=>s+p.stats[k],0)/Math.max(1,a.length);
  const L=[],E={batPower:0,batEye:0,batContact:0,pitchControl:0,pitchVel:0,formUp:0,clutch:0,run:0,dist:0,catchP:0};
  const add=(n,d,fn)=>{L.push({n,d});fn(E);};
  if(cnt('mood')>=1)add('チームの雰囲気','調子が崩れにくく、戻りやすい（ムードメーカー'+cnt('mood')+'人）',e=>e.formUp+=.18*Math.min(2,cnt('mood')));
  if(cnt('fierce')>=3)add('猛打線','強気が3人以上：パワー+4、選球眼-2',e=>{e.batPower+=4;e.batEye-=2;});
  if(cnt('calm')>=3)add('堅実野球','冷静が3人以上：選球眼+4、制球+4',e=>{e.batEye+=4;e.pitchControl+=4;});
  if(cnt('diligent')>=2&&cnt('genius')>=1)add('切磋琢磨','努力家と天才肌がいる：ミート+3',e=>e.batContact+=3);
  if(cnt('clutch')>=2)add('勝負強さ','勝負師が2人以上：チャンスの力+5',e=>e.clutch+=5);
  if(cnt('careful')>=1&&pits.some(p=>p.pers==='careful'))add('精密機械','投手に慎重がいる：制球+3',e=>e.pitchControl+=3);
  if(cnt('flashy')>=1&&cnt('calm')>=1)add('手綱を握る','お調子者と冷静が同居：お調子者の落ち込みが和らぐ',e=>e.formUp+=.1);
  if(avg(bats,'speed')>=62)add('機動力野球','打者の走力が高い：進塁しやすい',e=>e.run+=.15);
  if(avg(bats,'power')>=64)add('長打軍団','打者のパワーが高い：飛距離+3%',e=>e.dist+=.03);
  if(avg(bats,'defense')>=64)add('鉄壁の守備','野手の守備が高い：捕球率+6%',e=>e.catchP+=.06);
  if(new Set(bats.map(p=>p.pers)).size>=6)add('個性派集団','性格が6種類以上：全員の調子が安定',e=>e.formUp+=.1);
  if(pits.length>1&&pits[1].stats.velocity>=85)add('剛腕の抑え','抑え投手の球速が高い：終盤の継投で力を発揮',e=>e.pitchVel+=1);
  return {list:L,eff:E};
}

function eff(p,team,key,c){
  c=c||{};let v=p.stats[key];const pe=PERS[p.pers];
  if(pe.m[key])v+=pe.m[key];
  const E=team&&team.syn?team.syn.eff:null;
  if(E){const m={contact:E.batContact,power:E.batPower,eye:E.batEye,control:E.pitchControl,velocity:E.pitchVel};if(m[key])v+=m[key];}
  const f=p.form||0;
  v+=f*4*(f>0?(pe.formGain||1):(pe.formLoss||pe.vol||1));
  if(c.chance){if(pe.clutch)v+=pe.clutch;if(E&&E.clutch)v+=E.clutch;}else if(pe.base)v+=pe.base;
  return clamp(v,1,110);
}
function initForm(p,team){
  let r=Math.random();const E=team.syn.eff;r-=E.formUp*.3;
  p.form=r<.15?2:r<.7?1:r<.9?0:r<.98?-1:-2;
}
function bumpForm(p,team,dir){
  const pe=PERS[p.pers],E=team.syn.eff;let ch=.4*(pe.vol||1);
  ch*=dir<0?(1-Math.min(.5,E.formUp)):(1+E.formUp);
  if(Math.random()<ch){const b=p.form;p.form=clamp(p.form+dir,-2,2);return p.form!==b;}
  return false;
}
function recoverForms(team){team.bat.concat(team.pit).forEach(p=>{if(p.form<1&&Math.random()<.3+team.syn.eff.formUp)p.form++;});}

let AC=null,master=null,crowdG=null,muted=false;
function nbuf(sec){const n=Math.floor(AC.sampleRate*sec),b=AC.createBuffer(1,n,AC.sampleRate),d=b.getChannelData(0);let l=0;for(let i=0;i<n;i++){const w=Math.random()*2-1;l=(l+.02*w)/1.02;d[i]=w*.55+l*3;}return b;}
function ensureAudio(){
  try{
    if(!AC){
      AC=new (window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=muted?0:.9;
      const comp=AC.createDynamicsCompressor();master.connect(comp);comp.connect(AC.destination);
      const s=AC.createBufferSource();s.buffer=nbuf(4);s.loop=true;
      const f=AC.createBiquadFilter();f.type='bandpass';f.frequency.value=520;f.Q.value=.5;
      crowdG=AC.createGain();crowdG.gain.value=.05;s.connect(f);f.connect(crowdG);crowdG.connect(master);s.start();
    }

}

  const fl=AC.createBiquadFilter();fl.type=type||'bandpass';fl.frequency.setValueAtTime(f,t);if(f2)fl.frequency.exponentialRampToValueAtTime(f2,t+d);

function cheer(level){
  if(!AC||muted)return;const t=AC.currentTime,dur=1.3+level*.9,peak=[0,.2,.32,.46][level];

  s.connect(f1);s.connect(f2);f1.connect(g);f2.connect(g);g.connect(master);s.start(t);
  for(let i=0;i<4+level*4;i++)noise(.05,2300+rnd(1500),.1,'highpass',rndf(.1,dur*.85));

/* ---- バット（木目・グリップ・ラベル・ノブ） ---- */
function drawBat(c,x0,y0,a){
  const wAt=s=>s<22?5.2:s<72?5.2+(s-22)/50*6.3:11.5+Math.min(1,(s-72)/28)*1.5;
  const path=()=>{
    c.beginPath();
    for(let s=0;s<=99;s+=3){const w=wAt(s)/2;s?c.lineTo(s,-w):c.moveTo(s,-w);}
    c.lineTo(100,-wAt(100)/2);
    c.arc(100,0,wAt(100)/2,-Math.PI/2,Math.PI/2,false);
    for(let s=100;s>=0;s-=3)c.lineTo(s,wAt(s)/2);
    c.closePath();
  };
  c.save();c.translate(x0,y0);c.rotate(a);
  /* 輪郭の影 */
  path();c.strokeStyle='rgba(8,14,32,.6)';c.lineWidth=2.2;c.stroke();
  /* 木の本体（円柱の陰影） */
  const g=c.createLinearGradient(0,-7,0,7);
  g.addColorStop(0,'#F7E6C2');g.addColorStop(.35,'#E4C08A');g.addColorStop(.8,'#B2803F');g.addColorStop(1,'#84562A');
  path();c.fillStyle=g;c.fill();
  c.save();path();c.clip();
  /* 木目 */
  for(const f of[-.66,-.36,-.06,.24,.52]){
    c.beginPath();
    for(let s=0;s<=100;s+=4){const y=f*wAt(s)/2+Math.sin(s*.14+f*6)*.22;s?c.lineTo(s,y):c.moveTo(s,y);}
    c.strokeStyle=f>0?'rgba(120,72,30,.34)':'rgba(96,58,24,.28)';c.lineWidth=.7;c.stroke();
  }
  /* 節（ところどころ） */
  c.fillStyle='rgba(110,64,26,.35)';
  c.beginPath();c.ellipse(40,-1.4,1.6,.7,0,0,7);c.fill();
  c.beginPath();c.ellipse(57,1.8,1.2,.5,0,0,7);c.fill();
  /* ラベル（バーガンディ帯＋金の線） */
  c.fillStyle='#7E1D1B';c.fillRect(70,-8,26,16);
  c.fillStyle='#E9C35C';c.fillRect(70,-8,26,1.1);c.fillRect(70,6.9,26,1.1);
  c.fillStyle='#F4EBDD';c.fillRect(80,-2.2,7,4.4);
  c.fillStyle='#7E1D1B';c.fillRect(82,-1,3,2);
  /* 上面のハイライト */
  c.strokeStyle='rgba(255,252,240,.6)';c.lineWidth=1;c.beginPath();
  for(let s=4;s<=68;s+=4){const y=-wAt(s)/2+1.3;s===4?c.moveTo(s,y):c.lineTo(s,y);}
  c.stroke();
  c.restore();
  /* グリップ（テープ巻き） */
  const gg=c.createLinearGradient(0,-2.6,0,2.6);gg.addColorStop(0,'#3A3A42');gg.addColorStop(.5,'#1C1C22');gg.addColorStop(1,'#0E0E12');
  c.fillStyle=gg;c.fillRect(0,-2.6,26,5.2);
  c.strokeStyle='rgba(235,235,235,.42)';c.lineWidth=.8;
  for(let s=2;s<26;s+=3){c.beginPath();c.moveTo(s,-2.6);c.lineTo(s+1.8,2.6);c.stroke();}
  /* ノブ */
  c.fillStyle='#2F1D0E';c.beginPath();c.arc(-1.8,0,3.1,0,7);c.fill();
  c.fillStyle='rgba(255,255,255,.22)';c.beginPath();c.arc(-2.6,-1,1,0,7);c.fill();
  c.restore();
}

  const ctl=eff(pit,pteam,'control',{chance:ch}),sd=(100-ctl)*.42*(1+F*.8)*(S.practice?.3:1);
  const tx=clamp(target.x+gauss()*sd,105,295),ty=clamp(target.y+gauss()*sd,340,545);
  const mv=.6+eff(pit,pteam,'move')/100*.8,hs=pit.thr==='L'?-1:1;
  const ub=userBats();

}

/* ---- 打撃判定 ---- */
function makeContact(err,dx,dy,Pt,b,bt,bonus){
  const ch=chance(),contact=eff(b,bt,'contact',{chance:ch})+(bonus||0),power=eff(b,bt,'power',{chance:ch});
  const win=.085+contact*.0006,R=R_BASE+contact*.14,dist=Math.hypot(dx,dy*.9);
  if(Math.abs(err)>win||dist>R)return {kind:'miss'};
  const q=clamp(1-.5*Math.abs(err)/win-.4*dist/R+rndf(-.04,.04),.05,1);
  const hs=b.bat==='L'?-1:1;
  const v=20+28*q+(power-50)*.14+(Pt.kmh-130)*.1;
  const th=14+dy*.9+rndf(-1,1)*(4+(1-q)*16);
  const ph=hs*((err/win)*38+hs*dx*.4)+rndf(-4,4)*(1.2-q);
  return {kind:'contact',q,v,th,ph,foul:Math.abs(ph)>45||q<.18};
}
function doSwing(){
  if(S.mode!=='pitch'||!P||P.swung||!userBats())return;
  P.swung=true;P.swingT=0;
  const err=P.t-(P.T-SWING_LEAD),dx=S.aim.x-P.tx,dy=S.aim.y-P.ty;
  P.res=makeContact(err,dx,dy,P,curBatter(),batTeam(),0);
  S.cpos={x:S.aim.x,y:S.aim.y};
  if(P.res.kind==='miss'){sfx('whiff');return;}
  contactHit();
}
function contactHit(){S.mode='hitstop';S.hs=.14;S.flash=1;sfx('crack',P.res.q);if(S.practice){S.tc.contact++;}}
function aiBat(Pt){
  if(S.practice)return null;
  const b=curBatter(),bt=batTeam(),ch=chance(),bonus=DIFF[S.diff].bat;
  const contact=eff(b,bt,'contact',{chance:ch})+bonus,eye=eff(b,bt,'eye',{chance:ch})+bonus*.5;
  const outd=Math.hypot(Math.max(0,Math.abs(Pt.tx-ZONE.cx)-ZONE.w/2),Math.max(0,Math.abs(Pt.ty-ZONE.cy)-ZONE.h/2));
  let ps=Pt.strike?.55+contact/260:clamp(.34-eye/320+(outd<14?.12:0)-(outd>30?.1:0),.04,.5);
  if(S.strikes===2)ps=Math.min(.97,ps+(Pt.strike?.3:.15));
  if(S.balls===3&&!Pt.strike)ps*=.4;
  if(Math.random()>ps)return null;
  const pit=Pt.pit,pt=Pt.pteam;
  const sdT=.07-(contact-50)*.0004+(Pt.kmh>150?.012:0)+((Pt.key==='change'||Pt.key==='curve')?.02:0);
  const sdS=clamp(14+(eff(pit,pt,'velocity')-50)*.1+(eff(pit,pt,'move')-50)*.12-(contact-50)*.08,8,40);
  const err=gauss()*sdT,dx=gauss()*sdS,dy=gauss()*sdS+4;
  const res=makeContact(err,dx,dy,Pt,b,bt,bonus);
  return {at:clamp(Pt.T-SWING_LEAD+err,Pt.T*.2,Pt.T*1.04),res,ax:Pt.tx+dx,ay:Pt.ty+dy};
}

  const o={type:'',caught:false,dist:0,hang:1,dir:ph,gb:false,pop:false,kmh:Math.round(v*3.6*10)/10,th,v};
  if(th<8){
    o.gb=true;const pHit=clamp(.12+(v-22)/36*.45-dm,.08,.6);
    if(Math.random()<pHit){o.type=(ab>28&&v>40&&Math.random()<.25)?'2B':'1B';o.dist=rndf(48,75);}
    else{o.type=(S.bases[0]&&S.outs<2&&Math.random()<.45)?'DP':'GO';o.dist=rndf(24,40);}
    return o;
  }
  const D=v*v*Math.sin(2*rad)/9.8*.5*(1+Eb.dist),F=fenceR(ph);
  o.dist=Math.max(D,8);o.hang=clamp(2*v*Math.sin(rad)/9.8*.85,.7,5.5);
  if(D>F+1&&th>=11){o.type='HR';return o;}
  if(th<20){
    const pHit=clamp(.4+(v-28)/30*.5-dm,.3,.88);
    if(Math.random()<pHit){o.type=(D>68&&Math.random()<.45)?'2B':'1B';if(D>86&&ab>26&&Math.random()<.35)o.type='3B';}
    else{o.type='FO';o.caught=true;}
    return o;
  }
  if(D<30){o.type='FO';o.caught=true;o.pop=true;return o;}
  let pc=.9-(D-35)/100*.95-(v-35)/60*.25+dm;if(th>45)pc+=.1;pc=clamp(pc,.12,.94);
  if(Math.random()<pc){o.type='FO';o.caught=true;}
  else{o.type=D>78?'2B':'1B';if(D>90&&ab>24&&Math.random()<.35)o.type='3B';}

}
function planPlay(o){
  const b=S.bases,moves=[],E=batTeam().syn.eff;let runs=0,outsAdd=0,title='',n=[false,false,false],hit=false;
  const sp=(eff(curBatter(),batTeam(),'speed')-50)*.004+E.run;
  const hn={'1B':1,'2B':2,'3B':3,HR:4}[o.type];
  if(hn){
    hit=true;const occ=new Set();
    for(let base=3;base>=1;base--){
      if(!b[base-1])continue;let d=base+hn;
      if(hn<4&&d<4){
        if(hn===1&&base===2&&Math.random()<.5+sp)d=4;
        else if(hn===1&&base===1&&Math.random()<.2+sp)d=3;
        else if(hn===2&&base===1&&Math.random()<.35+sp)d=4;
      }
      d=Math.min(d,4);while(d<4&&occ.has(d))d--;
      if(d<4)occ.add(d);else runs++;
      moves.push({from:base,to:d});
    }
    let bd=Math.min(hn,4);while(bd<4&&occ.has(bd))bd--;
    if(bd<4)occ.add(bd);else runs++;
    moves.push({from:0,to:bd});occ.forEach(d=>{n[d-1]=true;});
    title=({'1B':'ヒット','2B':'ツーベース','3B':'スリーベース'})[o.type];
    if(o.type==='HR')title=['','ホームラン','ツーランホームラン','スリーラン','満塁ホームラン'][runs];
  }else if(o.type==='FO'){
    outsAdd=1;n=b.slice();title=o.pop?'内野フライ':'フライアウト';
    if(S.outs+1<3&&b[2]&&!o.pop&&o.dist>48){runs=1;n[2]=false;moves.push({from:3,to:4});title='犠牲フライ';}
  }else if(o.type==='GO'){
    outsAdd=1;title='ゴロアウト';const oc=S.outs+1;let r3='stay';
    if(b[2]){if(b[0]&&b[1])r3='score';else if(oc<3&&Math.random()<.5)r3='score';}
    if(r3==='score'){runs++;moves.push({from:3,to:4});}else if(b[2])n[2]=true;
    if(b[1]){if(b[0]){n[2]=true;moves.push({from:2,to:3});}else if(!n[2]&&oc<3&&Math.random()<.5){n[2]=true;moves.push({from:2,to:3});}else n[1]=true;}
    if(b[0]){n[1]=true;moves.push({from:1,to:2});}
  }else if(o.type==='DP'){
    outsAdd=2;title='ダブルプレー';
    if(b[2]){if(b[1]){runs++;moves.push({from:3,to:4});}else n[2]=true;}
    if(b[1]){n[2]=true;moves.push({from:2,to:3});}
    moves.push({from:1,to:2,out:true});
  }
  if(S.outs+outsAdd>=3){runs=0;moves.length=0;n=[false,false,false];}
  return {moves,runs,outsAdd,nb:n,title,hit,hr:o.type==='HR',kind:o.type};
}

  if(S.practice)return;

  let L=kind==='HR'?3:(kind==='3B'||kind==='2B')?2:kind==='1B'?1:kind==='DP'?2:kind==='K'?(ub?0:2):(kind==='GO'||kind==='FO')?(ub?0:1):0;

/* ================= 更新 ================= */
function update(dt){
  if(S.paused)return;
  if(P&&P.swung)P.swingT+=dt;
  if(S.flash>0)S.flash=Math.max(0,S.flash-dt*5);
  for(let i=S.parts.length-1;i>=0;i--){const p=S.parts[i];p.vy+=420*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;if(p.life<=0)S.parts.splice(i,1);}
  switch(S.mode){
    case 'idle':if(S.practice&&TUT[S.tut].done()){S.mode='gap';S.timer=.6;toast('<b>いいね！</b>',1200);}break;
    case 'gap':S.timer-=dt;if(S.timer<=0)tutAdvance();break;
    case 'ready':S.timer-=dt;if(S.timer<=0)beginWindup();break;
    case 'windup':S.wind+=dt;if(S.wind>=WINDUP)releasePitch();break;
    case 'pitch':{
      P.t+=dt;const u=P.t/P.T,b=ballPos(P,u);P.trail.push({x:b.x,y:b.y,s:b.s});if(P.trail.length>5)P.trail.shift();
      if(P.ai&&!P.swung&&P.t>=P.ai.at){
        P.swung=true;P.swingT=0;P.res=P.ai.res;S.cpos={x:P.ai.ax,y:P.ai.ay};
        if(P.res.kind==='contact'){contactHit();break;}else sfx('whiff');
      }
      if(!P.mitted&&P.t>=P.T&&(!P.res||P.res.kind!=='contact')){P.mitted=true;if(!P.swung)sfx('mitt',P.kmh);}
      if(P.t>=P.T*1.07)finishPitch();
    }break;
    case 'hitstop':S.hs-=dt;if(S.hs<=0){if(P.res.foul){S.mode='foulfly';S.ff=0;}else startField(P.res);}break;
    case 'foulfly':S.ff+=dt;if(S.ff>=.75)foulDone();break;
    case 'field':S.fv.t+=dt;if(S.fv.t>=S.fv.dur)finishField();break;
    case 'banner':{
      const b=S.bq[0];b.t+=dt;
      if(b.t>=b.dur){S.bq.shift();if(S.bq.length)onBannerStart(S.bq[0]);else{const cb=S.bcb;S.bcb=null;S.view='bat';if(cb)cb();}}
    }break;
  }
}

function drawZone(){

  ctx.strokeStyle='rgba(241,244,236,.16)';ctx.lineWidth=1;ctx.beginPath();

}

  ctx.shadowColor='rgba(255,255,255,.7)';ctx.shadowBlur=6*s+2;ctx.fillStyle='#F7F8F2';ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();ctx.shadowBlur=0;
  if(r>5){ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.clip();ctx.strokeStyle='#D2453B';ctx.lineWidth=Math.max(1,r*.12);
    ctx.beginPath();ctx.arc(x-r*1.05,y,r*.85,-.7,.7);ctx.stroke();ctx.beginPath();ctx.arc(x+r*1.05,y,r*.85,Math.PI-.7,Math.PI+.7);ctx.stroke();}
  ctx.restore();
}
function drawReticle(){
  const {x,y}=S.aim,R=userBats()?R_BASE+eff(curBatter(),batTeam(),'contact')*.14:14;

function runnerPos(m,t,fv){
  const r=clamp((t-.15)/fv.runDur,0,1),f=m.from+(m.to-m.from)*easeIO(r),seg=Math.min(3,Math.floor(f)),tt=f-seg;
  return {x:lerp(BASEPX[seg].x,BASEPX[seg+1].x,tt),y:lerp(BASEPX[seg].y,BASEPX[seg+1].y,tt),r};
}
function dot(x,y,r,fill,line){
  ctx.fillStyle='rgba(0,0,0,.3)';ctx.beginPath();ctx.ellipse(x+1,y+2.5,r,r*.5,0,0,7);ctx.fill();
  const g=ctx.createRadialGradient(x-r*.3,y-r*.3,1,x,y,r);g.addColorStop(0,shade(fill,40));g.addColorStop(1,fill);
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();ctx.strokeStyle=line;ctx.lineWidth=1.4;ctx.stroke();
}
function fvBall(fv,t){
  const o=fv.o;
  if(o.gb){
    const u=clamp(t/fv.ballDur,0,1),p=pol(o.dist*(1-Math.pow(1-u,2)),o.dir);
    if(!fv.plan.hit&&t>fv.ballDur){
      const legs=o.type==='DP'?[BASEPX[2],BASEPX[1]]:[BASEPX[1]];let from=fv.land,tt=t-fv.ballDur-.05;
      for(const to of legs){const d=.3;if(tt<=d){const e=clamp(tt/d,0,1);return {x:lerp(from.x,to.x,e),y:lerp(from.y,to.y,e),h:0};}tt-=d+.08;from=to;}
      return {x:from.x,y:from.y,h:0};
    }
    return {x:p.x,y:p.y,h:0};
  }
  const u=clamp(t/o.hang,0,1);let d=o.dist*u;
  const Hm=Math.pow(o.v*Math.sin(o.th*Math.PI/180),2)/(2*9.8)*.8;let hh=4*u*(1-u)*Hm*K*.8;
  if(t>o.hang){hh=0;if(!o.caught&&o.type!=='HR'){d=o.dist+10*easeOut(clamp((t-o.hang)/.6,0,1));}}
  const p=pol(d,o.dir);return {x:p.x,y:p.y,h:hh};
}

  const moved=new Set(pl.moves.map(m=>m.from));
  fv.pre.forEach((on,i)=>{if(on&&!moved.has(i+1)){const p=BASEPX[i+1];dot(p.x,p.y,5.2,bt.color,'#fff');}});
  pl.moves.forEach(m=>{const p=runnerPos(m,t,fv);if(m.out&&p.r>.55)return;if(m.to>=4&&p.r>=1)return;dot(p.x,p.y,5.2,bt.color,'#fff');});
  const b=fvBall(fv,t),gone=o.type==='HR'&&t>o.hang+.2;
  if(!gone){ctx.fillStyle='rgba(0,0,0,.35)';ctx.beginPath();ctx.ellipse(b.x,b.y,4.5,2.2,0,0,7);ctx.fill();
    ctx.fillStyle='#F7F8F2';ctx.beginPath();ctx.arc(b.x,b.y-b.h,4.6,0,7);ctx.fill();ctx.strokeStyle='#0E1A33';ctx.lineWidth=1.2;ctx.stroke();}

function setAim(x,y){const bx=userBats()?AIMBOX:AIMBOX_P,nx=clamp(x,bx.x0,bx.x1),ny=clamp(y,bx.y0,bx.y1);S.moved+=Math.hypot(nx-S.aim.x,ny-S.aim.y);S.aim.x=nx;S.aim.y=ny;}
function toLogical(e){const r=cv.getBoundingClientRect();return {x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H};}
function mainAction(touch){
  if(S.mode==='pitch')doSwing();
  else if(S.mode==='await'&&!touch)userThrow();
}
let lastTouch=null;
cv.addEventListener('pointerdown',e=>{
  ensureAudio();const p=toLogical(e);try{cv.setPointerCapture(e.pointerId);}catch(_){}
  if(e.pointerType==='mouse'){setAim(p.x,p.y);mainAction(false);}else lastTouch=p;
});
cv.addEventListener('pointermove',e=>{
  const p=toLogical(e);
  if(e.pointerType==='mouse')setAim(p.x,p.y);
  else if(lastTouch){setAim(S.aim.x+(p.x-lastTouch.x)*1.3,S.aim.y+(p.y-lastTouch.y)*1.3);lastTouch=p;}
});
cv.addEventListener('pointerup',e=>{if(e.pointerType!=='mouse'&&lastTouch){lastTouch=null;mainAction(true);}});
cv.addEventListener('pointercancel',()=>{lastTouch=null;});
cv.addEventListener('contextmenu',e=>e.preventDefault());
window.addEventListener('keydown',e=>{
  if(S.paused||!$('game')||$('game').classList.contains('hidden'))return;
  if(e.target&&/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;
  const k=e.key;
  if(k===' '||k==='Enter'){if(S.mode==='pitch'||S.mode==='await'){e.preventDefault();ensureAudio();mainAction(false);}return;}
  const st=8,m={ArrowLeft:[-st,0],ArrowRight:[st,0],ArrowUp:[0,-st],ArrowDown:[0,st],a:[-st,0],d:[st,0],w:[0,-st],s:[0,st]}[k];
  if(m){e.preventDefault();setAim(S.aim.x+m[0],S.aim.y+m[1]);}
});

          h('label',{class:'field'},'略称（3文字）',h('input',{type:'text',maxlength:3,value:t.short,on:{change:e=>{t.short=(e.target.value.trim()||'TEM').toUpperCase().slice(0,3);render();}}})))),
        h('h3',{},'メインカラー'),h('div',{class:'chips'},TCOL.map(c=>h('button',{class:'swatch','aria-pressed':String(t.color===c),'aria-label':c,style:'background:'+c,on:{click:()=>{t.color=c;render();}}}))),
        h('h3',{},'サブカラー'),h('div',{class:'chips'},TCOL2.map(c=>h('button',{class:'swatch','aria-pressed':String(t.color2===c),'aria-label':c,style:'background:'+c,on:{click:()=>{t.color2=c;render();}}}))),
        h('h3',{},'エンブレム'),seg([[0,'星'],[1,'波'],[2,'稲妻'],[3,'ひし形']],t.emblem,v=>{t.emblem=v;render();})),
      h('div',{class:'panel'},h('h3',{},'監督'),
        h('button',{class:'slot',on:{click:()=>showPlayerEditor(mg,t,{manager:true,pos:'監督'},np=>{t.manager=np;render();},render)}},faceCanvas(mg.face,46,{cap:st0.cap,cap2:st0.cap2,jersey:st0.jersey}),
          h('div',{},h('div',{class:'s1'},`監督  ${PERS[mg.pers].n}`),h('div',{class:'s2'},mg.name)))),
      h('div',{class:'panel'},h('h3',{},'選手（タップして編集）'),slots),
      h('div',{class:'panel'},h('h3',{},'組み合わせ効果'),
        syn.list.length?h('div',{},syn.list.map(s=>h('p',{},h('b',{style:'color:#FFC83D'},s.n+'　'),s.d))):
          h('p',{},'まだ効果はありません。同じ性格を揃える（例：強気3人）、努力家と天才肌を組ませる、ムードメーカーを入れる、など性格の組み合わせで効果が出ます。監督の性格もカウントされます。')),
      h('div',{class:'menu'},
        btn('保存して戻る',()=>{
          t.builtin=false;const i=STORE.teams.findIndex(x=>x.id===t.id);if(i>=0)STORE.teams[i]=t;else STORE.teams.push(t);saveStore();showTeams();}),
        btn('選手をすべてランダムに作り直す',()=>{if(confirm('全選手と監督を作り直しますか？')){const g=genTeam(mulberry(Date.now()%100000),t,1);t.players=g.players;t.manager=g.manager;render();}},'sec'),
        btn('保存せず戻る',showTeams,'sec')));
  };
  render();
}

/* ---- 選手エディタ ---- */
function showPlayerEditor(orig,team,opt,onSave,onCancel){
  const p=clone(orig),isMgr=!!opt.manager,isP=p.role==='P';
  const keys=isP?PSTAT:BSTAT,pool=isP?PPOOL:BPOOL;
  if(!isMgr){const keysArr=keys.map(k=>k[0]);if(sumStat(p)>pool||keysArr.some(k=>p.stats[k]==null)){Object.assign(p.stats,allocate(mulberry(Date.now()%9999),keysArr,pool));}}
  const st=styleFor(team,true);
  let prev=null;
  const redrawPrev=()=>{const c=faceCanvas(p.face,66,{cap:st.cap,cap2:st.cap2,jersey:st.jersey});if(prev)prev.replaceWith(c);prev=c;return c;};
  const fastText=h('div',{class:'note'});
  const persDesc=h('p',{class:'note'});
  const poolEl=h('span',{class:'pool'});
  const updatePool=()=>{if(isMgr)return;const rem=pool-sumStat(p);poolEl.textContent=`残りポイント ${rem}`;
    if(isP){const v=p.stats.velocity+(PERS[p.pers].m.velocity||0);fastText.textContent=`球速の目安：ストレート最速 ${Math.min(MAX_KMH,118+(v-20)/79*52.6).toFixed(1)}km/h（上限${MAX_KMH}km/h。調子で上下します）`;}};
  const partRows=Object.keys(PARTS).map(k=>{
    const val=h('div',{class:'v'});const upd=()=>{val.textContent=`${PART_LABEL[k]}：${PART_NAMES[k][p.face[k]]}`;};upd();
    const go=d=>{p.face[k]=(p.face[k]+d+PARTS[k])%PARTS[k];upd();redrawPrev();sfx('click');};
    return h('div',{class:'prow'},h('button',{'aria-label':PART_LABEL[k]+'前',on:{click:()=>go(-1)}},'◀'),val,h('button',{'aria-label':PART_LABEL[k]+'次',on:{click:()=>go(1)}},'▶'));
  });
  const persChips=h('div',{class:'chips'});
  const renderPers=()=>{persChips.replaceChildren(...PKEYS.map(k=>h('button',{class:'chipb','aria-pressed':String(p.pers===k),on:{click:()=>{p.pers=k;renderPers();updatePool();}}},PERS[k].n)));persDesc.textContent=PERS[p.pers].d;};
  renderPers();
  const statRows=isMgr?[]:keys.map(([k,l])=>{
    const n=h('span',{class:'n'},String(p.stats[k]));
    const r=h('input',{type:'range',min:SMIN,max:SMAX,value:p.stats[k],'aria-label':l,on:{input:e=>{
      const old=p.stats[k],rem=pool-sumStat(p);let nv=+e.target.value;if(nv-old>rem)nv=old+rem;p.stats[k]=nv;e.target.value=nv;n.textContent=nv;updatePool();}}});
    return h('div',{class:'srow'},h('span',{},l),r,n);
  });
  const pitchBox=isP?h('div',{class:'chips'},PITCH_OPT.map(k=>h('button',{class:'chipb','aria-pressed':String(p.pitches.includes(k)),on:{click:e=>{
    const i=p.pitches.indexOf(k);if(i>=0)p.pitches.splice(i,1);else if(p.pitches.length<4)p.pitches.push(k);else return;e.currentTarget.setAttribute('aria-pressed',String(p.pitches.includes(k)));}}},PT[k].n))):null;
  updatePool();
  openScreen(
    h('h2',{},`${opt.pos}  ${isMgr?'監督':isP?'投手':'野手'}を編集`),
    h('div',{class:'panel'},
      h('div',{class:'preview'},redrawPrev(),h('div',{style:'flex:1;display:flex;flex-direction:column;gap:8px'},
        h('label',{class:'field'},'名前',h('input',{type:'text',maxlength:8,value:p.name,on:{change:e=>{p.name=e.target.value.trim()||'名無し';}}})),
        isMgr?null:h('label',{class:'field'},'背番号',h('input',{type:'number',min:0,max:99,value:p.num,on:{change:e=>{p.num=clamp(parseInt(e.target.value)||0,0,99);e.target.value=p.num;}}})))),
      isMgr?null:h('div',{},h('h3',{},'打つ手'),seg([['R','右打ち'],['L','左打ち']],p.bat,v=>p.bat=v)),
      isP?h('div',{},h('h3',{},'投げる手'),seg([['R','右投げ'],['L','左投げ']],p.thr,v=>p.thr=v)):null,
      h('div',{class:'bar-row'},btn('顔をランダムに',()=>{p.face=randFace(Math.random);partRows.forEach(()=>{});redrawPrev();showPlayerEditor(p,team,opt,onSave,onCancel);},'sec sm'))),
    h('div',{class:'panel'},h('h3',{},'顔のパーツ'),partRows),
    h('div',{class:'panel'},h('h3',{},'性格'),persChips,persDesc),
    isMgr?null:h('div',{class:'panel'},h('h3',{},'ステータスを振り分け'),poolEl,statRows,fastText,
      isP?h('div',{},h('h3',{},'変化球（ストレートに加えて最大4つ）'),pitchBox):null),
    h('div',{class:'menu'},btn('決定',()=>{
      if(isP){if(!p.pitches.includes('straight'))p.pitches.unshift('straight');}
      onSave(p);}),btn('キャンセル',()=>onCancel(),'sec')));
}

/* ---- 結果 ---- */
function showResult(){
  const [a,hm]=S.teams,n=Math.max(S.lines[0].length,S.lines[1].length,S.innings),us=S.userSide,them=1-us;
  const res=S.score[us]>S.score[them]?'勝利':S.score[us]<S.score[them]?'敗戦':'引き分け';
  const rec=STORE.rec||(STORE.rec={w:0,l:0,d:0});if(res==='勝利')rec.w++;else if(res==='敗戦')rec.l++;else rec.d++;saveStore();
  if(res==='勝利'){cheer(3);}else if(res==='敗戦')groan();
  const head=h('tr',{},h('th',{},''),Array.from({length:n},(_,i)=>h('th',{},String(i+1))),h('th',{},'計'));
  const row=i=>h('tr',{},h('td',{},S.teams[i].short),Array.from({length:n},(_,k)=>h('td',{},S.lines[i][k]==null?'-':String(S.lines[i][k]))),h('td',{style:'color:#FFC83D'},String(S.score[i])));
  const all=S.teams[us].bat.concat(S.teams[us].pit);let mvp=null,best=-1;
  S.teams[us].bat.forEach(p=>{const sc=p.g.h+p.g.hr*2+p.g.rbi;if(sc>best){best=sc;mvp=p;}});
  S.teams[us].pit.forEach(p=>{const sc=p.g.k*.7-p.g.r+(p.g.pa||0)*0+ (p.pc>0?2:0);if(sc>best+1){best=sc;mvp=p;}});
  const tot=S.teams[us].bat.reduce((s,p)=>({ab:s.ab+p.g.ab,h:s.h+p.g.h,hr:s.hr+p.g.hr,k:s.k+p.g.k}),{ab:0,h:0,hr:0,k:0});
  const pk=S.teams[us].pit.reduce((s,p)=>s+p.g.k,0),pmax=Math.max(0,...S.teams[us].pit.map(p=>p.g.max));
  openScreen(h('h1',{},'ゲームセット'),
    h('div',{class:'panel'},h('div',{class:'big'},res),h('table',{class:'ls'},head,row(0),row(1))),
    h('div',{class:'panel'},h('h3',{},'あなたの球団の成績'),
      h('p',{},`打撃：${tot.ab}打数${tot.h}安打  本塁打${tot.hr}  三振${tot.k}`),
      h('p',{},`投手：奪三振${pk}  今日の最速 ${pmax?kmhText(pmax)+'km/h':'-'}`),
      mvp?h('p',{},h('b',{style:'color:#FFC83D'},'MVP  '),`${mvp.name}（${mvp.role==='B'?`${mvp.g.ab}打数${mvp.g.h}安打 ${mvp.g.hr}本塁打 ${mvp.g.rbi}打点`:`奪三振${mvp.g.k} 失点${mvp.g.r}`}）`):null,
      h('p',{class:'note'},`通算成績 ${rec.w}勝 ${rec.l}敗 ${rec.d}分`)),
    h('div',{class:'menu'},btn('もう一試合',()=>startMatch({mine:teamById(SETUP.mine||S.teams[us].id),opp:teamById(SETUP.opp||S.teams[them].id),side:SETUP.side,innings:SETUP.innings,diff:SETUP.diff})),btn('設定を変える',()=>{$('game').classList.add('hidden');showSetup();},'sec'),btn('タイトルへ',()=>{$('game').classList.add('hidden');showTitle();},'sec')));
}

/* ================= 起動 ================= */
buildLamps('lb',3);buildLamps('ls',2);buildLamps('lo',2);
$('mute').addEventListener('click',e=>{setMuted(!muted);e.currentTarget.setAttribute('aria-pressed',String(muted));});
$('menuBtn').addEventListener('click',()=>{if(S.mode!=='over')showGameMenu();});
let last=performance.now();
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;update(dt);render();requestAnimationFrame(frame);}
requestAnimationFrame(frame);
showTitle();
</script>
